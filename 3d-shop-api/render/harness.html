<script type="module">
import * as THREE from 'three';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { fitToView } from '/fitToView.js';

const post = (path, body) =>
  fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' },
                body: JSON.stringify(body) });

async function main() {
  const job = await (await fetch('/job.json')).json();
  const { width, height } = job.output;

  const renderer = new THREE.WebGLRenderer({
    antialias: true, preserveDrawingBuffer: true, alpha: true,
  });
  // Transparent so previews composite onto any page background.
  renderer.setClearColor(0x000000, 0);
  renderer.setPixelRatio(1);
  renderer.setSize(width, height);
  renderer.toneMapping = THREE.NoToneMapping;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  // A bundle is served as a folder, so the model keeps its neighbours and the
  // loaders resolve relative references themselves. A single file is /model.
  // Textures load asynchronously: a loader hands back a Texture at once and
  // fills in its image later, so rendering straight after parse draws black.
  const manager = new THREE.LoadingManager();
  let queued = 0;
  manager.onStart = () => { queued += 1; };
  const settled = new Promise((resolve) => { manager.onLoad = resolve; });

  const entry = job.source.entry ?? null;
  const base = entry === null ? '' : '/bundle/'.concat(entry.split('/').slice(0, -1).join('/'), entry.includes('/') ? '/' : '');
  const url = entry === null ? '/model' : '/bundle/'.concat(entry);

  const buffer = await (await fetch(url)).arrayBuffer();

  // The model is in hand and the page needs nothing else outside the bundle,
  // so everything else is shut off before a byte of it is parsed.
  await post('/sealed', {});
  const isGltf = job.source.format === 'glb' || job.source.format === 'gltf';

  let object;
  if (isGltf) {
    // The second argument is what external URIs resolve against.
    const gltf = await new Promise((res, rej) =>
      new GLTFLoader(manager).parse(buffer, base, res, rej));
    object = gltf.scene;
  } else if (job.source.format === 'stl') {
    // Geometry only: the format carries no material to light.
    object = new THREE.Mesh(
      new STLLoader().parse(buffer),
      new THREE.MeshPhongMaterial({ color: 0xb9bec7, flatShading: false }),
    );
  } else {
    const text = new TextDecoder().decode(buffer);
    const loader = new OBJLoader(manager);

    // OBJLoader parses no materials of its own: the .mtl is a second file and
    // has to be loaded and handed over, which only a bundle can offer.
    const library = base === '' ? null : await materialsFor(text, base, manager);

    if (library !== null) {
      loader.setMaterials(library);
    }

    object = loader.parse(text);
  }

  if (queued > 0) {
    await Promise.race([
      settled,
      new Promise((resolve) => setTimeout(resolve, 60000)),
    ]);
  }

  let triangles = 0;
  object.traverse((o) => {
    if (o.isMesh && o.geometry) {
      const g = o.geometry;
      triangles += (g.index ? g.index.count : (g.attributes.position?.count ?? 0)) / 3;
    }
  });

  if (triangles === 0) {
    await post('/failed', { reason: 'The model contained no geometry.' });
    return;
  }

  const scene = new THREE.Scene();

  // Same split as the client: glTF carries real materials and needs image-based
  // lighting, an .obj without an .mtl is Phong and gets washed out by it.
  if (isGltf) {
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
    scene.environmentIntensity = 1;
    scene.add(directional(0xffffff, 0.6, [4, 5, 3]));
    scene.add(directional(0xffffff, 0.2, [-4, -2, -4]));
  } else {
    scene.add(new THREE.AmbientLight(0xffffff, 0.3));
    scene.add(directional(0xffffff, 1.1, [4, 5, 3]));
    scene.add(directional(0xffffff, 0.35, [-4, -2, -4]));
  }

  const { scale, center } = fitToView(object);
  const outer = new THREE.Group();
  const inner = new THREE.Group();
  outer.scale.setScalar(scale);
  inner.position.set(center[0], center[1], center[2]);
  inner.add(object);
  outer.add(inner);
  scene.add(outer);

  // Past this the lines cover the model solid.
  const WIREFRAME_MAX_TRIANGLES = 750000;
  const wanted = job.passes ?? ['shaded', 'wireframe'];
  const shading = wanted.includes('shaded');
  const wireframes = wanted.includes('wireframe') && triangles <= WIREFRAME_MAX_TRIANGLES;

  // Filled first so the lines behind the model are occluded, offset back so the
  // fill does not z-fight the lines on its own surface.
  const matte = new THREE.MeshBasicMaterial({
    color: 0xdfe3e8,
    side: THREE.DoubleSide,
    polygonOffset: true,
    polygonOffsetFactor: 1,
    polygonOffsetUnits: 1,
  });
  const wire = new THREE.MeshBasicMaterial({ color: 0x141821, wireframe: true });

  // Built from an array rather than a canvas: a canvas depends on the platform's
  // rasteriser, and these images have to come out byte-identical on a re-render.
  const checker = new THREE.MeshBasicMaterial({ map: checkerTexture(), side: THREE.DoubleSide });
  const normals = new THREE.MeshNormalMaterial({ side: THREE.DoubleSide });
  const matcap = new THREE.MeshMatcapMaterial({
    matcap: matcapTexture(),
    side: THREE.DoubleSide,
  });

  const overrides = { checker, normals, matcap };

  const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);

  for (let i = 0; i < job.angles.length; i += 1) {
    const angle = job.angles[i];
    camera.fov = angle.fov;
    camera.position.set(...angle.position);
    camera.up.set(...(angle.up ?? [0, 1, 0]));
    camera.lookAt(...(angle.target ?? [0, 0, 0]));
    camera.updateProjectionMatrix();

    if (shading) {
      renderer.render(scene, camera);

      await post('/image', {
        pass: 'shaded',
        index: i,
        triangles: Math.round(triangles),
        coverage: coverageOf(renderer),
        png: renderer.domElement.toDataURL('image/png'),
      });
    }

    for (const [name, material] of Object.entries(overrides)) {
      if (! wanted.includes(name)) {
        continue;
      }

      scene.overrideMaterial = material;
      renderer.render(scene, camera);
      scene.overrideMaterial = null;

      await post('/image', {
        pass: name,
        index: i,
        triangles: Math.round(triangles),
        coverage: coverageOf(renderer),
        png: renderer.domElement.toDataURL('image/png'),
      });
    }

    if (! wireframes) {
      continue;
    }

    scene.overrideMaterial = matte;
    renderer.render(scene, camera);
    scene.overrideMaterial = wire;
    renderer.autoClear = false;
    renderer.render(scene, camera);
    renderer.autoClear = true;
    scene.overrideMaterial = null;

    await post('/image', {
      pass: 'wireframe',
      index: i,
      triangles: Math.round(triangles),
      coverage: coverageOf(renderer),
      png: renderer.domElement.toDataURL('image/png'),
    });
  }

  await post('/done', {
    triangles: Math.round(triangles),
    count: job.angles.length,
    wireframes,
  });
}

/** The .mtl an .obj names, if it is beside it and readable. */
async function materialsFor(text, base, manager) {
  const named = /^\s*mtllib\s+(.+)$/m.exec(text);

  if (named === null) {
    return null;
  }

  const response = await fetch(base + named[1].trim());

  if (! response.ok) {
    return null;
  }

  const loader = new MTLLoader(manager);
  loader.setResourcePath(base);
  const library = loader.parse(await response.text(), base);
  library.preload();

  return library;
}

/**
 * Squares in UV space, so a stretched or overlapping unwrap shows as stretched
 * or overlapping squares. Nearest filtering keeps the edges hard, which is what
 * makes the distortion legible.
 */
// A matcap is a picture of a lit sphere. three.js picks the colour by which way
// the surface faces, so one small image lights the whole model with no lights
// and no UVs. That is the point of the pass: nothing the seller did to the
// textures can flatter the mesh.
//
// Generated from the sphere's own maths rather than drawn on a canvas, for the
// same reason the checker is.
function matcapTexture() {
  const size = 256;
  const pixels = new Uint8Array(size * size * 4);

  const unit = (x, y, z) => {
    const length = Math.hypot(x, y, z);

    return [x / length, y / length, z / length];
  };

  const key = unit(-0.45, 0.55, 0.7);
  const bounce = unit(0.6, -0.25, 0.55);
  // Halfway between the key light and the viewer: where a highlight sits.
  const half = unit(key[0], key[1], key[2] + 1);

  for (let y = 0; y < size; y += 1) {
    for (let x = 0; x < size; x += 1) {
      const at = (y * size + x) * 4;
      const nx = ((x + 0.5) / size) * 2 - 1;
      const ny = 1 - ((y + 0.5) / size) * 2;
      const squared = nx * nx + ny * ny;

      // Outside the sphere is backdrop, and nothing samples it.
      if (squared > 1) {
        pixels[at] = 0x16;
        pixels[at + 1] = 0x16;
        pixels[at + 2] = 0x1a;
        pixels[at + 3] = 0xff;
        continue;
      }

      const nz = Math.sqrt(1 - squared);
      const lit = Math.max(0, nx * key[0] + ny * key[1] + nz * key[2]);
      const filled = Math.max(0, nx * bounce[0] + ny * bounce[1] + nz * bounce[2]);
      const shine = Math.pow(Math.max(0, nx * half[0] + ny * half[1] + nz * half[2]), 48);
      const rim = Math.pow(1 - nz, 4);
      // Kept off the ceiling deliberately: a blown-out highlight is a patch of
      // flat white, and flat white is exactly what this pass exists to remove.
      const value = Math.min(0.94, 0.17 + 0.5 * lit + 0.13 * filled + 0.24 * shine + 0.09 * rim);
      const byte = Math.round(value * 255);

      pixels[at] = byte;
      pixels[at + 1] = byte;
      pixels[at + 2] = byte;
      pixels[at + 3] = 0xff;
    }
  }

  const texture = new THREE.DataTexture(pixels, size, size, THREE.RGBAFormat);
  texture.needsUpdate = true;

  return texture;
}

function checkerTexture() {
  const size = 64;
  const pixels = new Uint8Array(size * size * 4);

  for (let y = 0; y < size; y += 1) {
    for (let x = 0; x < size; x += 1) {
      const light = ((x >> 3) + (y >> 3)) % 2 === 0;
      const value = light ? 0xe8 : 0x50;
      const at = (y * size + x) * 4;

      pixels[at] = value;
      pixels[at + 1] = value;
      pixels[at + 2] = value;
      pixels[at + 3] = 0xff;
    }
  }

  const texture = new THREE.DataTexture(pixels, size, size, THREE.RGBAFormat);
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(8, 8);
  texture.magFilter = THREE.NearestFilter;
  texture.minFilter = THREE.NearestFilter;
  texture.needsUpdate = true;

  return texture;
}

// Background is transparent, so any alpha is geometry.
function coverageOf(renderer) {
  const { width, height } = renderer.domElement;
  const gl = renderer.getContext();
  const pixels = new Uint8Array(width * height * 4);
  gl.readPixels(0, 0, width, height, gl.RGBA, gl.UNSIGNED_BYTE, pixels);

  let covered = 0;
  for (let i = 3; i < pixels.length; i += 4) {
    if (pixels[i] > 8) covered += 1;
  }

  return covered / (width * height);
}

function directional(colour, intensity, position) {
  const light = new THREE.DirectionalLight(colour, intensity);
  light.position.set(...position);
  return light;
}

main().catch((error) => post('/failed', { reason: String(error).slice(0, 300) }));
</script>
