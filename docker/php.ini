; A model upload is validated at 50 MB, and nginx in front accepts 128m. PHP's
; own defaults are 2M and 8M, so without this the shipped stack rejects every
; real upload before any of that validation runs.
upload_max_filesize = 64M
post_max_size = 64M

; One upload is one model file plus its thumbnails.
max_file_uploads = 12

; Long enough for a 64 MB body to arrive and be hashed, short enough that a
; stalled request does not hold a worker forever. Rendering is not done here.
max_execution_time = 120

; Stated rather than inherited: MeshPrescan::MAX_JSON_BYTES is sized against it.
memory_limit = 512M
